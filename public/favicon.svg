<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFAB00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF7A00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#shadow)" />

  <!-- Outer Ring / Compass Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.9" />

  <!-- Compass Star Needle -->
  <polygon points="256,150 286,256 256,362 226,256" fill="#FFFFFF" opacity="0.95" />
  <polygon points="150,256 256,226 362,256 256,286" fill="#FFFFFF" opacity="0.75" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="28" fill="#FF7A00" stroke="#FFFFFF" stroke-width="12" />

  <!-- Sparkle Accent -->
  <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="#FFFFFF" />
</svg>
